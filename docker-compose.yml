# Local Postgres + Redis for development. Start with: pnpm db:up
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: bmu
      POSTGRES_PASSWORD: bmu
      POSTGRES_DB: bmu_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
